<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://formspree.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src 'self';">
    <title>Resume | Joseph Sheetz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/mobile.css" media="(max-width: 768px)">
    <style>
        :root {
            --primary: #07070a;
            --secondary: #0f1114;
            --accent: #00d9ff;
            --accent-warm: #ff6b35;
            --text: #e0e6ed;
            --text-dim: #8892a6;
            --surface: #0b0d11;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-padding-top: 80px;
        }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text);
            line-height: 1.8;
            min-height: 100vh;
        }

        /* Modern Black/Gray Layered Grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(255,255,255,0.02) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 2px, transparent 2px);
            background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px;
            background-position: 0 0, 0 0, 0 0, 0 0;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 0;
            opacity: 0.9;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            z-index: 100;
            background: rgba(7, 7, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 217, 255, 0.1);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--accent), var(--accent-warm));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Main Content */
        main {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            padding: 7rem 2rem 4rem;
            z-index: 10;
        }

        /* Resume Header */
        .resume-header {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 217, 255, 0.2);
        }

        .resume-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .resume-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
        }

        .resume-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* PDF Viewer Container */
        .pdf-container {
            background: rgba(20, 24, 41, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .pdf-viewer {
            width: 100%;
            height: 800px;
            border: 1px solid rgba(0, 217, 255, 0.15);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Download Section */
        .download-section {
            text-align: center;
            padding: 2rem;
            background: rgba(20, 24, 41, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
        }

        .download-section p {
            color: var(--text-dim);
            margin-bottom: 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-warm));
            color: var(--primary);
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 217, 255, 0.5);
        }

        /* Footer */
        footer {
            position: relative;
            text-align: center;
            padding: 2rem;
            color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            z-index: 10;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 1rem;
            }

            .resume-title {
                font-size: 2rem;
            }

            .pdf-container {
                padding: 1rem;
            }

            .pdf-viewer {
                height: 600px;
            }

            .resume-meta {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">JOSEPH SHEETZ</a>
            <ul class="nav-links">
                <li><a href="index.html">← Back</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="resume-header">
            <h1 class="resume-title">Resume</h1>
            <div class="resume-meta">
                <span>📄 Joseph Sheetz</span>
                <span>📅 Updated February 2026</span>
            </div>
        </div>

        <div class="pdf-container">
            <iframe class="pdf-viewer" src="resume.pdf"></iframe>
        </div>

        <div class="download-section">
            <p>Download my resume:</p>
            <a href="resume.pdf" download class="btn btn-primary">Download PDF</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Joseph Sheetz. All rights reserved.</p>
    </footer>
</body>
</html>
