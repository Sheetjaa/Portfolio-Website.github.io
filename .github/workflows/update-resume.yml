name: Fetch Latest Resume from GitHub

on:
  # DISABLED: Pipeline not working on Overleaf's side - will re-enable when fixed
  # schedule:
  #   # Run every 6 hours to check for updates
  #   - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger (commented out to disable)
  # repository_dispatch:
  #   types: [update-resume]

jobs:
  update-resume:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v3
      
      - name: Download latest resume PDF from Resume repo
        run: |
          # Download the latest PDF from Resume repository
          # Adjust the URL if your PDF has a different name
          curl -L https://github.com/Sheetjaa/Resume/releases/download/latest/resume.pdf -o Resume_Latest.pdf || \
          curl -L https://raw.githubusercontent.com/Sheetjaa/Resume/main/resume.pdf -o Resume_Latest.pdf || true
      
      - name: Check if file was downloaded
        run: |
          if [ -f Resume_Latest.pdf ]; then
            echo "✓ Resume downloaded successfully"
            ls -lh Resume_Latest.pdf
          else
            echo "⚠ Resume file not found - your Resume repo may not have a compiled PDF yet"
            echo "  You may need to:"
            echo "  1. Commit the PDF to your Resume repo, OR"
            echo "  2. Set up GitHub Actions in the Resume repo to compile the PDF"
          fi
      
      - name: Commit and push if changed
        if: hashFiles('Resume_Latest.pdf') != ''
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Resume_Latest.pdf || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update resume from Overleaf" && git push)
